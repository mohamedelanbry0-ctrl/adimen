<script>

/* =====================================================
   CAREERTALK ACADEMY
   STUDENT MANAGEMENT SYSTEM
===================================================== */


/* ================= DATABASE ================= */

const STORAGE_KEY = "careertalk_students_v3";


let students = [];

let currentFilter = "all";


/* ================= SAFE STORAGE ================= */

/*
هذا الجزء مهم جدًا.

بعض الـ Preview/WebView يمنع localStorage.

لذلك لن يتوقف البرنامج إذا كان التخزين ممنوعًا.
*/

function loadStudents(){

    try{

        const data =
        localStorage.getItem(STORAGE_KEY);

        if(data){

            const parsed =
            JSON.parse(data);

            if(Array.isArray(parsed)){

                students = parsed;

                return;

            }

        }

    }catch(error){

        console.log(
            "Local storage unavailable."
        );

    }

    students = [];

}



function saveStudents(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(students)
        );

        return true;

    }catch(error){

        /*
        مهم:
        لا نظهر رسالة خطأ للمستخدم.
        الطالب سيتم إضافته للجدول
        حتى لو كان التخزين غير متاح.
        */

        console.log(
            "Storage unavailable. Running in temporary mode."
        );

        return false;

    }

}



/* ================= TODAY ================= */

function getToday(){

    const d = new Date();

    const year =
    d.getFullYear();

    const month =
    String(d.getMonth()+1)
    .padStart(2,"0");

    const day =
    String(d.getDate())
    .padStart(2,"0");

    return `${year}-${month}-${day}`;

}



/* ================= DATE VALIDATION ================= */

/*
نسمح بصيغتين:

2026-09-07

أو

07/09/2026
*/

function normalizeDate(value){

    value =
    String(value)
    .trim();


    /* DD/MM/YYYY */

    const slash =
    value.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
    );


    if(slash){

        const day =
        slash[1].padStart(2,"0");

        const month =
        slash[2].padStart(2,"0");

        const year =
        slash[3];

        return `${year}-${month}-${day}`;

    }


    /* YYYY-MM-DD */

    const dash =
    value.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})$/
    );


    if(dash){

        const year =
        dash[1];

        const month =
        dash[2].padStart(2,"0");

        const day =
        dash[3].padStart(2,"0");

        return `${year}-${month}-${day}`;

    }


    return null;

}



/* ================= CHECK REAL DATE ================= */

function isValidDate(dateString){

    const normalized =
    normalizeDate(dateString);

    if(!normalized){

        return false;

    }


    const parts =
    normalized.split("-");

    const year =
    Number(parts[0]);

    const month =
    Number(parts[1]);

    const day =
    Number(parts[2]);


    const date =
    new Date(
        year,
        month - 1,
        day
    );


    return (
        date.getFullYear() === year &&
        date.getMonth() === month - 1 &&
        date.getDate() === day
    );

}



/* ================= DAYS LEFT ================= */

function calculateDaysLeft(endDate){

    const normalized =
    normalizeDate(endDate);

    if(!normalized){

        return 0;

    }


    const today =
    new Date();

    today.setHours(
        0,0,0,0
    );


    const end =
    new Date(
        normalized + "T00:00:00"
    );


    const difference =
    end.getTime()
    -
    today.getTime();


    return Math.ceil(
        difference /
        (1000 * 60 * 60 * 24)
    );

}



/* ================= STATUS ================= */

function getStatus(days){

    if(days < 0){

        return "expired";

    }

    if(days <= 3){

        return "expiring";

    }

    return "active";

}



/* ================= WHATSAPP ================= */

function formatWhatsApp(phone){

    let number =
    String(phone)
    .replace(/\D/g,"");


    if(number.startsWith("01")){

        number =
        "20" + number;

    }


    if(number.startsWith("0020")){

        number =
        number.substring(2);

    }


    return number;

}



/* ================= OPEN MODAL ================= */

function openModal(index = null){

    const modal =
    document.getElementById(
        "student-modal"
    );


    modal.classList.remove("hidden");

    modal.classList.add("flex");


    const form =
    document.getElementById(
        "student-form"
    );


    if(index === null){

        form.reset();

        form.dataset.editIndex = "";


        document.getElementById(
            "modal-title"
        ).innerText =
        "إضافة طالب جديد";


        document.getElementById(
            "save-button"
        ).innerHTML =
        '<i class="fa-solid fa-floppy-disk ml-1"></i> حفظ الطالب';


        /*
        تاريخ البداية الافتراضي
        */

        document.getElementById(
            "modal-start"
        ).value =
        getToday();

    }

    else{

        const student =
        students[index];


        if(!student){

            return;

        }


        form.dataset.editIndex =
        index;


        document.getElementById(
            "modal-title"
        ).innerText =
        "تعديل بيانات الطالب";


        document.getElementById(
            "save-button"
        ).innerHTML =
        '<i class="fa-solid fa-pen ml-1"></i> تحديث البيانات';


        document.getElementById(
            "modal-name"
        ).value =
        student.name || "";


        document.getElementById(
            "modal-phone"
        ).value =
        student.phone || "";


        document.getElementById(
            "modal-course"
        ).value =
        student.course || "";


        document.getElementById(
            "modal-paid"
        ).value =
        student.paid || "";


        document.getElementById(
            "modal-start"
        ).value =
        student.start || "";


        document.getElementById(
            "modal-end"
        ).value =
        student.end || "";


        document.getElementById(
            "modal-notes"
        ).value =
        student.notes || "";

    }

}



/* ================= CLOSE MODAL ================= */

function closeModal(){

    const modal =
    document.getElementById(
        "student-modal"
    );


    modal.classList.add("hidden");

    modal.classList.remove("flex");


    document.getElementById(
        "student-form"
    ).reset();

}



/* ================= SAVE STUDENT ================= */

function saveStudent(event){

    event.preventDefault();


    const name =
    document.getElementById(
        "modal-name"
    ).value.trim();


    const phone =
    document.getElementById(
        "modal-phone"
    ).value.trim();


    const course =
    document.getElementById(
        "modal-course"
    ).value.trim();


    const paid =
    Number(
        document.getElementById(
            "modal-paid"
        ).value
    );


    let start =
    document.getElementById(
        "modal-start"
    ).value.trim();


    let end =
    document.getElementById(
        "modal-end"
    ).value.trim();


    const notes =
    document.getElementById(
        "modal-notes"
    ).value.trim();



    /* REQUIRED */

    if(
        !name ||
        !phone ||
        !course ||
        !start ||
        !end
    ){

        alert(
            "من فضلك أكمل جميع البيانات المطلوبة."
        );

        return;

    }



    /* DATE */

    if(!isValidDate(start)){

        alert(
            "تاريخ البداية غير صحيح.\n\nاكتب التاريخ بهذا الشكل:\n2026-09-07\n\nأو:\n07/09/2026"
        );

        return;

    }


    if(!isValidDate(end)){

        alert(
            "تاريخ النهاية غير صحيح.\n\nاكتب التاريخ بهذا الشكل:\n2026-10-07\n\nأو:\n07/10/2026"
        );

        return;

    }


    /* NORMALIZE */

    start =
    normalizeDate(start);

    end =
    normalizeDate(end);



    /* DATE ORDER */

    if(end < start){

        alert(
            "تاريخ النهاية يجب أن يكون بعد تاريخ البداية."
        );

        return;

    }



    /* PAYMENT */

    if(
        Number.isNaN(paid) ||
        paid < 0
    ){

        alert(
            "من فضلك أدخل مبلغًا صحيحًا."
        );

        return;

    }



    /* STUDENT */

    const student = {

        id:
        Date.now().toString(),

        name:name,

        phone:phone,

        course:course,

        paid:paid,

        start:start,

        end:end,

        notes:notes

    };



    const form =
    document.getElementById(
        "student-form"
    );


    const editIndex =
    form.dataset.editIndex;



    /* EDIT */

    if(editIndex !== ""){

        students[
            Number(editIndex)
        ] = student;

    }


    /* ADD */

    else{

        students.unshift(student);

    }



    /*
    حاول الحفظ.
    لو localStorage ممنوع، لن يمنع الإضافة.
    */

    saveStudents();



    closeModal();


    renderTable();

    updateStats();



    alert(
        editIndex !== ""
        ?
        "تم تحديث بيانات الطالب بنجاح ✅"
        :
        "تمت إضافة الطالب بنجاح ✅"
    );

}



/* ================= DELETE ================= */

function deleteStudent(index){

    const student =
    students[index];


    if(!student){

        return;

    }


    const confirmDelete =
    confirm(
        "هل أنت متأكد من حذف الطالب؟\n\n"
        + student.name
    );


    if(!confirmDelete){

        return;

    }


    students.splice(
        index,
        1
    );


    saveStudents();


    renderTable();

    updateStats();

}



/* ================= FILTER ================= */

function setFilter(
    filter,
    button
){

    currentFilter =
    filter;


    document
    .querySelectorAll(".filter-btn")
    .forEach(btn => {

        btn.classList.remove(
            "bg-indigo-600",
            "text-white"
        );

        btn.classList.add(
            "bg-slate-800",
            "text-slate-300"
        );

    });


    button.classList.remove(
        "bg-slate-800",
        "text-slate-300"
    );


    button.classList.add(
        "bg-indigo-600",
        "text-white"
    );


    renderTable();

}



/* ================= ESCAPE HTML ================= */

function escapeHTML(text){

    return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



/* ================= RENDER ================= */

function renderTable(){

    const tbody =
    document.getElementById(
        "students-table-body"
    );


    const search =
    document.getElementById(
        "search-input"
    ).value
    .trim()
    .toLowerCase();


    tbody.innerHTML = "";


    const filtered =
    students.filter(student => {


        const days =
        calculateDaysLeft(
            student.end
        );


        const status =
        getStatus(days);


        const text = `
            ${student.name}
            ${student.phone}
            ${student.course}
        `
        .toLowerCase();


        const matchesSearch =
        text.includes(search);


        const matchesFilter =
        currentFilter === "all"
        ||
        currentFilter === status;


        return (
            matchesSearch &&
            matchesFilter
        );

    });



    if(filtered.length === 0){

        tbody.innerHTML = `

        <tr>

        <td colspan="8"
        class="p-12 text-center text-slate-500">

        <i class="fa-solid fa-users
        text-4xl mb-3"></i>

        <p>
        لا توجد بيانات مطابقة.
        </p>

        </td>

        </tr>

        `;

        return;

    }



    filtered.forEach(student => {


        const index =
        students.indexOf(student);


        const days =
        calculateDaysLeft(
            student.end
        );


        const status =
        getStatus(days);



        let badge = "";



        if(status === "active"){

            badge = `

            <span
            class="bg-emerald-500/10

نذكرك أن اشتراكك في CareerTalk Academy لكورس (${student.course}) ${days >= 0 ? `سينتهي خلال ${days} يوم.` : "انتهى."}

للتجديد أو الاستفسار تواصل معنا.

CareerTalk Academy`

        const whatsapp =
        `https://wa.me/${number}?text=${message}`;



        tbody.innerHTML += `

        <tr
        class="hover:bg-slate-800/50 transition">


        <td class="p-4">

        <div class="font-bold text-white">

        ${
            student.notes
            ?
            `
            <div
            class="text-[10px]
            text-slate-500 mt-1">

            <i class="fa-solid fa-note-sticky"></i>

            ${escapeHTML(student.notes)}

            </div>
            `
            :
            ""
        }

        </td>



        <td class="p-4">

        <span
        class="font-mono
        text-indigo-400
        text-xs">

        ${escapeHTML(student.phone)}

        </span>

        </td>



        <td class="p-4">

        <span
        class="font-semibold">

        ${escapeHTML(student.course)}

        </span>

        </td>



        <td class="p-4">

        <span
        class="font-black
        text-emerald-400">

        ${Number(student.paid)
        .toLocaleString("ar-EG")}

        ج.م

        </span>

        </td>



        <td class="p-4
        text-xs text-slate-400">

        ${student.start}

        </td>



        <td class="p-4
        text-xs text-slate-400">

        ${student.end}

        </td>



        <td class="p-4">

        ${badge}

        </td>



        <td class="p-4">

        <div
        class="flex justify-center gap-2">


        <a
        href="${whatsapp}"
        target="_blank"
        rel="noopener noreferrer"

        class="bg-emerald-600
        hover:bg-emerald-500
        w-9 h-9 rounded-xl
        flex items-center
        justify-center">

        <i class="fa-brands fa-whatsapp"></i>

        </a>



        <button
        onclick="openModal(${index})"

        class="bg-indigo-600/20
        hover:bg-indigo-600
        text-indigo-400
        hover:text-white
        w-9 h-9
        rounded-xl">

        <i class="fa-solid fa-pen"></i>

        </button>



        <button
        onclick="deleteStudent(${index})"

        class="bg-rose-600/10
        hover:bg-rose-600
        text-rose-400
        hover:text-white
        w-9 h-9
        rounded-xl">

        <i class="fa-solid fa-trash"></i>

        </button>


        </div>

        </td>


        </tr>

        `;

    });

}



/* ================= STATS ================= */

function updateStats(){

    let active = 0;

    let expiring = 0;

    let expired = 0;

    let revenue = 0;


    students.forEach(student => {


        revenue +=
        Number(student.paid) || 0;


        const days =
        calculateDaysLeft(
            student.end
        );


        const status =
        getStatus(days);


        if(status === "active"){

            active++;

        }

        else if(status === "expiring"){

            expiring++;

        }

        else{

            expired++;

        }

    });



    document.getElementById(
        "stat-total"
    ).innerText =
    students.length;



    document.getElementById(
        "stat-active"
    ).innerText =
    active;



    document.getElementById(
        "stat-expiring"
    ).innerText =
    expiring;



    document.getElementById(
        "stat-expired"
    ).innerText =
    expired;



    document.getElementById(
        "stat-revenue"
    ).innerText =
    revenue.toLocaleString("ar-EG")
    + " ج.م";

}



/* ================= CLICK OUTSIDE ================= */

document
.getElementById("student-modal")
.addEventListener(
"click",
function(event){

    if(event.target === this){

        closeModal();

    }

});



/* ================= ESC ================= */

document.addEventListener(
"keydown",
function(event){

    if(event.key === "Escape"){

        closeModal();

    }

});



/* ================= START ================= */

window.addEventListener(
"DOMContentLoaded",
function(){

    loadStudents();

    renderTable();

    updateStats();

});

</script>
